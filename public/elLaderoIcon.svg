<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8A00" />
      <stop offset="65%" stop-color="#D95C00" />
      <stop offset="100%" stop-color="#1A0D00" />
    </linearGradient>
  </defs>

  <!-- Sol (Fondo) -->
  <circle cx="340" cy="210" r="130" fill="url(#sunGrad)" />

  <!-- Onda Verde Claro (Fondo inferior) -->
  <path d="M 30,370 
           C 80,330 150,330 230,365 
           C 310,400 420,380 475,280 
           C 450,420 330,460 240,420 
           C 150,380 70,390 30,370 Z" 
        fill="#72CC32" />

  <!-- Planta -->
  <g fill="#1B9D38">
    <!-- Tallo -->
    <path d="M 130 270 Q 140 210 135 150" fill="none" stroke="#1B9D38" stroke-width="8" stroke-linecap="round" />
    
    <!-- Hoja Inferior Izquierda -->
    <path d="M 136 230 Q 90 230 80 180 Q 120 180 136 210 Z" />
    
    <!-- Hoja Media Derecha -->
    <path d="M 137 210 Q 180 200 190 150 Q 150 140 136 180 Z" />
    
    <!-- Hoja Superior Izquierda -->
    <path d="M 136 170 Q 100 160 90 110 Q 130 110 136 150 Z" />
    
    <!-- Hoja Superior Derecha -->
    <path d="M 135 150 Q 160 110 150 60 Q 120 80 135 150 Z" />
  </g>

  <!-- Onda Verde Oscuro (Frente principal) -->
  <path d="M 40,340 
           C 70,240 150,260 220,290 
           C 300,320 400,320 480,240 
           C 440,360 320,380 230,350 
           C 140,320 70,320 40,340 Z" 
        fill="#008236" />
</svg>
